<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Transcripteur</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111719">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Mise en page : une colonne type dictaphone — bande d'enregistrement en haut, transcription en dessous, historique en bas. */
:root{
  --bg:#eceff0; --surface:#fafbfb; --fg:#162023; --muted:#5a696c; --line:#d2d9da;
  --accent:#1e6a68; --accent-fg:#ffffff; --rec:#d1372b; --tape:#dfe5e5; --wave:#1e6a68;
  --display:"Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101618; --surface:#172023; --fg:#e4ebea; --muted:#8fa1a2; --line:#273437;
  --accent:#5dbdb3; --accent-fg:#0d1a1a; --rec:#ff5b4e; --tape:#0c1213; --wave:#5dbdb3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101618; --surface:#172023; --fg:#e4ebea; --muted:#8fa1a2; --line:#273437;
  --accent:#5dbdb3; --accent-fg:#0d1a1a; --rec:#ff5b4e; --tape:#0c1213; --wave:#5dbdb3; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--display);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding-block:12px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}

/* Bande d'enregistrement */
.deck{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.tape{position:relative;background:var(--tape);border-radius:10px;height:84px;overflow:hidden}
.tape canvas{width:100%;height:100%;display:block}
.tape .tc{position:absolute;left:10px;top:8px;font:600 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.tape .tc.on{color:var(--rec)}
.controls{display:flex;align-items:center;gap:14px}
.rec-btn{width:72px;height:72px;border-radius:50%;border:3px solid var(--rec);background:transparent;display:grid;place-items:center;flex:none;transition:transform .15s}
.rec-btn:active{transform:scale(.95)}
.rec-btn i{display:block;width:44px;height:44px;border-radius:50%;background:var(--rec);transition:all .2s}
.rec-btn.on i{width:26px;height:26px;border-radius:5px}
.ctl-text{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.ctl-label{font-weight:700;font-size:17px}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ready{background:var(--accent)} .dot.busy{background:#d99a1e} .dot.err{background:var(--rec)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar>span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.import{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.btn:disabled{opacity:.5;cursor:default}

/* Transcription */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.doc-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.doc-title{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.doc-meta{font-size:12px;color:var(--muted);font-family:var(--mono);font-variant-numeric:tabular-nums}
.doc-body{padding:14px 16px;font-family:var(--read);font-size:17px;line-height:1.6;display:flex;flex-direction:column;gap:10px;min-height:120px}
.seg{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline}
.seg time{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.seg p{margin:0;min-width:0;overflow-wrap:anywhere;outline:none;border-radius:4px}
.seg p:focus{background:var(--tape)}
.no-tc .seg{grid-template-columns:1fr} .no-tc .seg time{display:none}
.pending{font-family:var(--display);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.pending::before{content:"";width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.empty{font-family:var(--display);color:var(--muted);font-size:14px}
.doc-actions{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px 14px;border-top:1px solid var(--line)}
.doc-actions .btn{padding:8px 12px;min-height:40px;font-size:14px}
.btn.danger{color:var(--rec)}

/* Historique */
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 0;font-weight:700}
.history{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.history li button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.history .h-title{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.history .h-date{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.history .h-prev{grid-column:1/-1;font-family:var(--read);color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history li.sel button{background:var(--surface)}

/* Réglages */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--fg);padding:0;width:min(520px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sheet{padding:18px;display:flex;flex-direction:column;gap:16px}
.sheet h3{margin:0;font-size:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;font-weight:700}
.field small{color:var(--muted);font-size:12px;line-height:1.4}
.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;min-height:44px;width:100%}
.field textarea{font:14px/1.45 var(--read);resize:vertical}
.btn.small{align-self:flex-start;padding:6px 10px;min-height:36px;font-size:13px}
dialog{max-height:calc(100dvh - 32px);overflow-y:auto}
.check{display:flex;align-items:center;gap:10px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.sheet-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100vw - 32px);z-index:20}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Transcripteur</h1>
    <button class="icon-btn" id="openSettings" aria-label="Réglages">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <section class="deck" aria-label="Enregistrement">
    <div class="tape"><canvas id="wave"></canvas><span class="tc" id="timer">00:00</span></div>
    <div class="controls">
      <button class="rec-btn" id="recBtn" aria-label="Démarrer la dictée"><i></i></button>
      <div class="ctl-text">
        <span class="ctl-label" id="recLabel">Dicter</span>
        <div class="status"><span class="dot" id="dot"></span><span id="statusText">Modèle non chargé</span></div>
        <div class="bar" id="bar" hidden><span id="barFill"></span></div>
      </div>
    </div>
    <div class="import">
      <label class="btn" for="fileInput">
        <svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
        Importer un fichier audio
      </label>
      <input type="file" id="fileInput" accept="audio/*,video/*,.m4a,.mp3,.wav,.ogg,.opus,.aac,.webm,.mp4" hidden>
      <button class="btn" id="loadBtn" hidden>Télécharger le modèle</button>
    </div>
  </section>

  <article class="doc" id="doc" aria-live="polite">
    <div class="doc-head">
      <span class="doc-title" id="docTitle">Aucune transcription</span>
      <span class="doc-meta" id="docMeta">Appuyez sur le bouton rouge pour dicter, ou importez un enregistrement.</span>
    </div>
    <div class="doc-body" id="docBody"><span class="empty">Le texte apparaît ici au fil de la dictée, phrase par phrase. Vous pouvez le corriger en touchant un passage.</span></div>
    <div class="doc-actions" id="docActions" hidden>
      <button class="btn" id="copyBtn">Copier</button>
      <button class="btn" id="shareBtn">Partager</button>
      <button class="btn" id="txtBtn">Exporter .txt</button>
      <button class="btn danger" id="delBtn">Supprimer</button>
    </div>
  </article>

  <section>
    <h2>Historique</h2>
    <ul class="history" id="history"></ul>
    <p class="empty" id="historyEmpty">Rien pour l'instant.</p>
  </section>
</div>

<template id="displayOpts">
  <div class="field">
    <span class="lbl">Affichage</span>
    <label class="check"><input type="checkbox" id="setTc"> Afficher les minutages</label>
    <label class="check"><input type="checkbox" id="setTcExport"> Inclure les minutages à l'export</label>
  </div>
</template>

<div class="toast" id="toast" hidden></div>

<script src="dictee.js"></script>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const NATIVE = window.AndroidBridge || null; // présent dans l'appli Android

/* ---------- Stockage local ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (_) { return false; } },
};
const legacy = store.get('tx.settings', {});
const view = Object.assign({ tc: true, tcExport: false }, store.get('tx.view', { tc: legacy.tc ?? true, tcExport: legacy.tcExport ?? false }));
function saveView() { store.set('tx.view', view); }
let sessions = store.get('tx.sessions', []);
let shownId = sessions[0] ? sessions[0].id : null;
function saveSessions() { if (!store.set('tx.sessions', sessions)) toast("Stockage plein : supprimez d'anciennes transcriptions."); }

/* ---------- Utilitaires ---------- */
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2600);
}
function fmtTime(s) {
  s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  const mm = String(m).padStart(2, '0'), ss = String(x).padStart(2, '0');
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}
function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' }) + ' ' +
         d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

/* ---------- Moteur partagé ---------- */
const D = Dictee.create({ base: './', storageKey: 'dictee', legacySettingsKey: 'tx.settings', notify: toast });
let engineStatus = D.status();
D.on('status', (s) => { engineStatus = s; updateStatus(); renderDoc(); });

/* ---------- Sessions ---------- */
function newSession(source) {
  const sess = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: new Date().toISOString(), source, segments: [], duration: 0 };
  sessions.unshift(sess); shownId = sess.id; saveSessions();
  return sess;
}
function shown() { return sessions.find((s) => s.id === shownId) || null; }
function sessionText(sess, withTc) {
  return sess.segments.map((g) => (withTc ? `[${fmtTime(g.t)}] ` : '') + g.text).join(withTc ? '\n' : '\n\n');
}
let workingSessId = null; // session qui reçoit encore du texte

/* ---------- Dictée en direct ---------- */
let rec = null; // { handle, sess }
const waveHist = [];
async function startRec() {
  const sess = newSession('Dictée');
  waveHist.length = 0;
  const handle = await D.startMic({
    previous: () => { const l = sess.segments[sess.segments.length - 1]; return l ? l.text : ''; },
    onText: (text, t) => { sess.segments.push({ t, text }); saveSessions(); renderDoc(); renderHistory(); },
    onLevel: (rms) => waveHist.push(rms),
    onStop: ({ seconds }) => { sess.duration = seconds; saveSessions(); },
    onIdle: () => {
      if (workingSessId === sess.id) workingSessId = null;
      if (!sess.segments.length) toast('Aucune parole détectée.');
      renderDoc(); renderHistory();
    },
  });
  if (!handle) { sessions = sessions.filter((x) => x.id !== sess.id); shownId = sessions[0] ? sessions[0].id : null; saveSessions(); renderDoc(); renderHistory(); return; }
  rec = { handle, sess }; workingSessId = sess.id;
  updateRecUi(); renderDoc(); renderHistory(); tick();
}
async function stopRec() {
  const r = rec; if (!r) return;
  rec = null;
  await r.handle.stop();
  updateRecUi(); renderDoc(); renderHistory();
}

/* ---------- Import de fichier ---------- */
async function importFile(file) {
  if (rec) { toast("Arrêtez la dictée avant d'importer."); return; }
  $('#statusText').textContent = 'Lecture du fichier…';
  const sess = newSession(file.name.replace(/\.[^.]+$/, ''));
  workingSessId = sess.id;
  renderDoc(); renderHistory();
  try {
    const res = await D.transcribeFile(file, {
      onStart: ({ duration }) => { sess.duration = duration; saveSessions(); renderDoc(); },
      onText: (text, t) => { sess.segments.push({ t, text }); sess.segments.sort((a, b) => a.t - b.t); saveSessions(); renderDoc(); renderHistory(); },
    });
    if (!res.segments) toast('Aucune parole détectée dans ce fichier.');
  } catch (err) {
    toast(err.message);
    if (!sess.segments.length) { sessions = sessions.filter((x) => x.id !== sess.id); shownId = sessions[0] ? sessions[0].id : null; saveSessions(); }
  } finally {
    if (workingSessId === sess.id) workingSessId = null;
    updateStatus(); renderDoc(); renderHistory();
  }
}

/* ---------- Rendu ---------- */
function updateStatus() {
  const s = engineStatus;
  const dot = $('#dot'), st = $('#statusText'), bar = $('#bar'), fill = $('#barFill');
  dot.className = 'dot'; bar.hidden = true;
  if (s.state === 'loading') {
    dot.classList.add('busy');
    st.textContent = s.cached ? 'Préparation du modèle…' : `Téléchargement du modèle… ${s.downloadPct} %`;
    bar.hidden = false; fill.style.width = s.downloadPct + '%';
  } else if (s.state === 'error') {
    dot.classList.add('err'); st.textContent = 'Erreur : ' + s.error;
  } else if (s.busy) {
    dot.classList.add('busy');
    if (s.fileJob) { st.textContent = `Transcription… ${s.fileJob.done}/${s.fileJob.total}`; bar.hidden = false; fill.style.width = Math.round(s.fileJob.done / s.fileJob.total * 100) + '%'; }
    else st.textContent = s.busy > 1 ? `Transcription… ${s.busy} passages en attente` : 'Transcription…';
  } else if (s.state === 'ready') {
    dot.classList.add('ready'); st.textContent = `Prêt · ${s.device === 'webgpu' ? 'GPU' : 'processeur'} · hors ligne`;
  } else {
    st.textContent = s.cached ? 'Modèle en mémoire, chargé au premier usage' : `Modèle à télécharger (${s.modelSize}, une seule fois)`;
  }
  $('#loadBtn').hidden = !(s.state === 'error' || (s.state === 'idle' && !s.cached));
  $('#loadBtn').textContent = s.state === 'error' ? 'Réessayer' : 'Télécharger le modèle';
}

function updateRecUi() {
  const on = !!rec;
  $('#recBtn').classList.toggle('on', on);
  $('#recBtn').setAttribute('aria-label', on ? 'Arrêter la dictée' : 'Démarrer la dictée');
  $('#recLabel').textContent = on ? 'Arrêter' : 'Dicter';
  $('#timer').classList.toggle('on', on);
  if (!on) $('#timer').textContent = '00:00';
}

function renderDoc() {
  const sess = shown();
  const body = $('#docBody');
  $('#doc').classList.toggle('no-tc', !view.tc);
  if (!sess) {
    $('#docTitle').textContent = 'Aucune transcription';
    $('#docMeta').textContent = 'Appuyez sur le bouton rouge pour dicter, ou importez un enregistrement.';
    $('#docActions').hidden = true;
    return;
  }
  $('#docTitle').textContent = sess.source;
  const words = sess.segments.reduce((n, g) => n + g.text.split(/\s+/).length, 0);
  const dur = sess.duration || (rec && rec.sess === sess ? rec.handle.seconds : 0);
  $('#docMeta').textContent = `${fmtDate(sess.date)} · ${fmtTime(dur)} · ${words} mots`;
  // Ne pas écraser un passage en cours de correction
  if (body.contains(document.activeElement) && document.activeElement.tagName === 'P') return;
  body.innerHTML = '';
  sess.segments.forEach((g, i) => {
    const row = document.createElement('div'); row.className = 'seg';
    const tm = document.createElement('time'); tm.textContent = fmtTime(g.t);
    const p = document.createElement('p'); p.textContent = g.text; p.contentEditable = 'true'; p.spellcheck = true;
    p.addEventListener('blur', () => {
      const v = p.textContent.trim();
      if (!v) sess.segments.splice(i, 1); else g.text = v;
      saveSessions(); renderDoc(); renderHistory();
    });
    row.append(tm, p); body.append(row);
  });
  const working = workingSessId === sess.id && (engineStatus.busy || engineStatus.state === 'loading');
  const add = (cls, txt) => { const d = document.createElement(cls === 'empty' ? 'span' : 'div'); d.className = cls; d.textContent = txt; body.append(d); };
  if (working) add('pending', 'Transcription en cours…');
  else if (rec && rec.sess === sess && !sess.segments.length) add('pending', "À l'écoute…");
  else if (!sess.segments.length) add('empty', 'Aucun texte.');
  $('#docActions').hidden = !sess.segments.length;
}

function renderHistory() {
  const ul = $('#history'); ul.innerHTML = '';
  $('#historyEmpty').hidden = sessions.length > 0;
  sessions.forEach((s) => {
    const li = document.createElement('li'); if (s.id === shownId) li.className = 'sel';
    const b = document.createElement('button');
    b.innerHTML = '<span class="h-title"></span><span class="h-date"></span><span class="h-prev"></span>';
    b.children[0].textContent = s.source;
    b.children[1].textContent = fmtDate(s.date);
    b.children[2].textContent = s.segments.map((g) => g.text).join(' ') || '—';
    b.addEventListener('click', () => { shownId = s.id; renderDoc(); renderHistory(); $('#doc').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    li.append(b); ul.append(li);
  });
}

/* ---------- Visualisation de la bande ---------- */
const cv = $('#wave'), g2 = cv.getContext('2d');
function drawWave() {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  g2.setTransform(dpr, 0, 0, dpr, 0, 0); g2.clearRect(0, 0, w, h);
  const css = getComputedStyle(document.documentElement);
  const col = rec ? css.getPropertyValue('--rec').trim() : css.getPropertyValue('--wave').trim();
  const step = 3, n = Math.floor(w / step), mid = h / 2 + 8, amp = h / 2 - 14;
  const bars = []; for (let i = waveHist.length - 1; i >= 0 && bars.length < n; i -= 4) { let m = 0; for (let k = 0; k < 4 && i - k >= 0; k++) m = Math.max(m, waveHist[i - k]); bars.push(m); }
  g2.fillStyle = col;
  bars.forEach((v, j) => {
    const x = w - (j + 1) * step, a = Math.max(1, Math.min(amp, Math.sqrt(v) * amp * 2.2));
    g2.globalAlpha = 0.35 + 0.65 * (1 - j / n);
    g2.fillRect(x, mid - a, 2, a * 2);
  });
  g2.globalAlpha = 1;
  if (!bars.length) { g2.fillStyle = css.getPropertyValue('--line').trim(); g2.fillRect(0, mid - 0.5, w, 1); }
  if (waveHist.length > 20000) waveHist.splice(0, waveHist.length - 8000);
}
function tick() {
  drawWave();
  if (rec) { $('#timer').textContent = fmtTime(rec.handle.seconds); requestAnimationFrame(tick); }
}

/* ---------- Actions ---------- */
$('#recBtn').addEventListener('click', () => { rec ? stopRec() : startRec(); });
$('#fileInput').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) importFile(f); });
$('#loadBtn').addEventListener('click', () => D.loadModel());

$('#copyBtn').addEventListener('click', async () => {
  const s = shown(); if (!s) return;
  const text = sessionText(s, view.tcExport);
  if (NATIVE) { toast(NATIVE.copy(text) ? 'Texte copié' : 'Copie impossible'); return; }
  try { await navigator.clipboard.writeText(text); toast('Texte copié'); }
  catch (_) { toast('Copie impossible : sélectionnez le texte à la main.'); }
});
$('#shareBtn').addEventListener('click', async () => {
  const s = shown(); if (!s) return;
  const text = sessionText(s, view.tcExport);
  if (NATIVE) { NATIVE.share(s.source, text); return; }
  if (navigator.share) { try { await navigator.share({ title: s.source, text }); } catch (_) {} }
  else { try { await navigator.clipboard.writeText(text); toast('Partage indisponible : texte copié'); } catch (_) {} }
});
$('#txtBtn').addEventListener('click', () => {
  const s = shown(); if (!s) return;
  const d = new Date(s.date);
  const fname = `${s.source.replace(/[\\/:*?"<>|]+/g, '_')}_${d.toISOString().slice(0, 10)}.txt`;
  const text = sessionText(s, view.tcExport) + '\n';
  if (NATIVE) { toast(NATIVE.saveText(fname, text) ? 'Enregistré dans Téléchargements/Transcripteur' : "Échec de l'enregistrement"); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
  a.download = fname; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
});
let delArmed = false;
$('#delBtn').addEventListener('click', () => {
  const s = shown(); if (!s) return;
  if (rec && rec.sess === s) { toast("Arrêtez la dictée d'abord."); return; }
  if (!delArmed) { delArmed = true; $('#delBtn').textContent = 'Confirmer la suppression'; setTimeout(() => { delArmed = false; $('#delBtn').textContent = 'Supprimer'; }, 3000); return; }
  delArmed = false; $('#delBtn').textContent = 'Supprimer';
  sessions = sessions.filter((x) => x.id !== s.id); shownId = sessions[0] ? sessions[0].id : null;
  saveSessions(); renderDoc(); renderHistory(); toast('Transcription supprimée');
});

/* ---------- Réglages : moteur partagé + affichage propre au Transcripteur ---------- */
const extra = $('#displayOpts').content.cloneNode(true).firstElementChild;
extra.querySelector('#setTc').addEventListener('change', (e) => { view.tc = e.target.checked; saveView(); renderDoc(); });
extra.querySelector('#setTcExport').addEventListener('change', (e) => { view.tcExport = e.target.checked; saveView(); });
$('#openSettings').addEventListener('click', () => {
  extra.querySelector('#setTc').checked = view.tc;
  extra.querySelector('#setTcExport').checked = view.tcExport;
  D.openSettings({ extra });
});
D.on('settings', () => updateStatus());

/* ---------- Démarrage ---------- */
if (!NATIVE && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
window.addEventListener('resize', drawWave);
updateStatus(); updateRecUi(); renderDoc(); renderHistory(); drawWave();
</script>
</body>
</html>
